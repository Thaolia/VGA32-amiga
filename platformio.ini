; ============================================================================
;  Amiga 500 sur TTGO VGA32 v1.4 (ESP32 classique WROVER + PSRAM, FabGL)
;
;  arduino-esp32 2.0.17 (requis a la fois par FabGL et par l'I2S legacy hérité de
;  l'émulateur) : fourni par platform-espressif32 6.10.0 (filet : 6.8.0-6.13.0).
; ============================================================================
[env:ttgo-vga32]
platform  = espressif32@6.10.0
board     = esp32dev
framework = arduino

; --- flash 16 Mo + partitions « Huge APP » (ROM Kick + ADF gonflent le binaire) ---
board_build.flash_size      = 16MB
board_upload.flash_size     = 16MB
board_build.partitions      = partitions/huge_app_16MB.csv
; PSRAM quad (QSPI) de la WROVER classique
board_build.arduino.memory_type = qio_qspi

build_flags =
  -DBOARD_HAS_PSRAM          ; active l'init PSRAM -> heap_caps_malloc(MALLOC_CAP_SPIRAM)
  -DCORE_DEBUG_LEVEL=0
  -O2
  -Isrc/core
  -Isrc/hal
  -Ithird_party/musashi
  -Ithird_party/sinfl
  -Iassets                   ; kick_rom.h / wb_adf.h generes (git-ignores)

; cœur Musashi + sinfl vendored sous third_party/ (chacun a son library.json)
lib_extra_dirs = third_party
lib_ldf_mode   = deep+
lib_deps =
  fabgl@1.0.9

monitor_speed = 115200
upload_speed  = 921600

; Note Phase 0 : flag -mfix-esp32-psram-cache-issue volontairement ABSENT.
; Le garder couterait du debit PSRAM (le risque perf n°1). Si la carte est en
; silicium rev1 (esptool chip_id), l'ajouter ici pour un boot sur ; sinon rev3 = sans.
