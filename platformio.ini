; ============================================================================
;  Amiga 500 sur TTGO VGA32 v1.4 (ESP32 classique WROVER + PSRAM, FabGL)
;
;  arduino-esp32 2.0.17 (requis a la fois par FabGL et par l'I2S legacy hérité de
;  l'émulateur) : fourni par platform-espressif32 6.10.0 (filet : 6.8.0-6.13.0).
; ============================================================================
[env:ttgo-vga32]
platform  = espressif32@6.10.0
board     = esp32dev
framework = arduino

; --- flash 4 Mo (ESP32-PICO-D4 mesuré : esptool flash_id) + partitions « Huge APP »
;     standard du framework : app 3 Mo (ROM Kick + ADF gonflent le binaire) ---
board_build.flash_size      = 4MB
board_upload.flash_size     = 4MB
board_build.partitions      = huge_app.csv
; PSRAM quad (QSPI) externe
board_build.arduino.memory_type = qio_qspi

build_flags =
  -DBOARD_HAS_PSRAM          ; active l'init PSRAM -> heap_caps_malloc(MALLOC_CAP_SPIRAM)
  -mfix-esp32-psram-cache-issue ; silicium rev1 (v1.1 mesuré) : sinon corruption PSRAM
  -DCORE_DEBUG_LEVEL=0
  -O2
  -Isrc/core
  -Isrc/hal
  -Ithird_party/musashi
  -Ithird_party/sinfl
  -Iassets                   ; kick_rom.h / wb_adf.h generes (git-ignores)

; cœur Musashi + sinfl vendored sous third_party/ (chacun a son library.json)
lib_extra_dirs = third_party
lib_ldf_mode   = deep+
lib_deps =
  fabgl@1.0.9

monitor_speed = 115200
upload_speed  = 921600

; Note : -mfix-esp32-psram-cache-issue est requis sur la carte de référence (ESP32-PICO-D4
; rev v1.1 = rev1). Il coûte du débit PSRAM ; sur une carte rev3 (esptool chip_id), on
; peut le retirer pour gagner en fps.
